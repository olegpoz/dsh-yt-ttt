name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The package has no runtime dependencies, so the checks run without an
      # install step and need no lockfile.
      - run: node --test test/*.test.mjs
